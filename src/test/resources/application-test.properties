spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
# Cargar datos desde el archivo data.sql
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

email.sender=${EMAIL:dev@example.com}
email.password=${PASSWORD:dev-password}
security.jwt.key.private=${SECRET_KEY:dev-secret-key-please-change-in-prod-min-32-chars}
security.jwt.user.generator=${USER_JWT:learnsync-test}
google.client.id=${GOOGLE_CLIENT_ID:dev-google-id}
imgur.bearer.token=${IMGUR_BEARER_TOKEN:dev-token}
imgur.api.url=${IMGUR_API_URL:https://api.imgur.com/3/image}
spring.jpa.open-in-view=true
app.rate-limit.enabled=false

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true