spring.datasource.driverClassName=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///learnsync_test
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

email.sender=test@example.com
email.password=test
security.jwt.key.private=test-secret-key-please-change-in-prod-min-32-chars-for-testcontainers
security.jwt.user.generator=learnsync-test
google.client.id=test-google-id
imgur.bearer.token=test-token
imgur.api.url=https://api.imgur.com/3/image
