spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/learnsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# H2 console deshabilitada en prod
spring.h2.console.enabled=false

email.sender=${EMAIL:? EMAIL es requerido en prod}
email.password=${PASSWORD:? PASSWORD es requerido en prod}
security.jwt.key.private=${SECRET_KEY:? SECRET_KEY es requerido en prod}
security.jwt.user.generator=${USER_JWT:? USER_JWT es requerido en prod}
google.client.id=${GOOGLE_CLIENT_ID:? GOOGLE_CLIENT_ID requerido}
imgur.bearer.token=${IMGUR_BEARER_TOKEN:? IMGUR_BEARER_TOKEN requerido}
